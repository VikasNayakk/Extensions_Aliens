<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Speakers</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="brand-mark">VS</div><div><strong>Voice Speakers</strong><small>CHATGPT CONVERSATION READER</small></div><button id="settings" class="icon-btn" title="Voice settings">⚙</button></header>
<main>
<div class="row"><button id="load" class="primary">Load current ChatGPT chat</button><button id="refresh" class="secondary">Refresh</button></div>
<p id="status" class="status" aria-live="polite">Open a ChatGPT conversation, then load it.</p>
<label for="search">Search your messages</label><input id="search" type="text" placeholder="Search prompts…">
<div class="list-head"><strong>Your messages</strong><span id="count" class="muted">0</span></div><div id="messages" class="message-list"></div>
<section id="selected" hidden><div class="result-head"><strong id="selectedTitle">Selected reply</strong><button id="copy" class="text-btn">Copy reply</button></div><div class="prompt-box"><label>Your message</label><div id="promptText"></div></div><div class="reply-box"><label>ChatGPT reply</label><div id="replyText"></div></div>
<div class="row"><button id="speak" class="primary">Read reply aloud</button><button id="stop" class="secondary">Stop</button></div>
<label for="rate">Speech speed <output id="rateValue">0.8×</output></label><input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="0.8">
<label for="voice">Voice</label><select id="voice"><option value="any">Default voice</option><option value="female">Female voice</option><option value="male">Male voice</option></select><p class="muted">Available voices depend on your browser and operating system.</p></section>
</main><script src="ui.js"></script></body></html>
