<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Speakers</title><link rel="stylesheet" href="styles.css"></head><body class="app"><header class="topbar"><div class="brand"><div class="brand-mark">VS</div><div><strong>Voice Speakers</strong><small>CHATGPT READER</small></div></div><button id="settings" class="icon-button" title="Settings" aria-label="Settings">⚙</button></header><main><section class="load-card"><h1>Conversation</h1><p id="status" class="status">Open a ChatGPT conversation, then load its prompts.</p><div class="row"><button id="load" class="primary">Load conversation</button><button id="refresh" class="secondary" title="Refresh">↻ Refresh</button></div></section><section class="stats"><div><span id="count">0</span><small>Matching prompts</small></div><div><span id="totalCount">—</span><small>Total prompts</small></div></section><section class="search-section"><label for="search">Search your prompts</label><div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Search messages…"></div></section><section class="list-section"><div class="section-heading"><strong>Your prompts</strong><span class="muted">Select to view reply</span></div><div id="messages" class="message-list"></div></section><section id="selected" class="selected-card" hidden><div class="section-heading"><div><small class="eyebrow">SELECTED PROMPT</small><strong id="selectedTitle">Selected reply</strong></div><button id="copy" class="text-button">Copy reply</button></div><div class="prompt-box"><label>Your message</label><div id="promptText"></div></div><div class="reply-box"><label>ChatGPT reply</label><div id="replyText"></div></div><div class="play-row"><button id="speak" class="primary">Read selected reply</button><button id="stop" class="secondary stop" title="Stop">■</button></div><div class="speech-settings"><div class="setting-line"><label for="rate">Speech speed</label><output id="rateValue">0.8×</output></div><input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="0.8"><label for="voice">Voice</label><select id="voice"><option value="any">System default</option><option value="female">Female voice</option><option value="male">Male voice</option></select></div></section></main><script src="ui.js"></script></body></html>
